name: Bump Version
description: Bump version using commitizen and push tag

inputs:
  prerelease:
    description: "Prerelease type (rc) or 'release' for a normal bump"
    required: false
    default: "rc"

outputs:
  version:
    description: The new version number
    value: ${{ steps.bump.outputs.version }}
  bumped:
    description: Whether a version bump occurred
    value: ${{ steps.bump.outputs.bumped }}

runs:
  using: composite
  steps:
    - name: Install UV
      uses: astral-sh/setup-uv@v7

    - name: Install commitizen
      shell: bash
      run: uv tool install commitizen

    - name: Configure git
      shell: bash
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Bump version
      id: bump
      shell: bash
      env:
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        if [ "$PRERELEASE" = "release" ]; then
          BUMP_CMD="cz bump --yes"
        else
          BUMP_CMD="cz bump --yes --prerelease $PRERELEASE"
        fi

        if $BUMP_CMD 2>&1; then
          echo "bumped=true" >> $GITHUB_OUTPUT
          VERSION=$(cz version --project)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to version $VERSION"
        else
          echo "bumped=false" >> $GITHUB_OUTPUT
          echo "No version bump needed (no conventional commits requiring bump)"
        fi

    - name: Push changes and tag
      if: steps.bump.outputs.bumped == 'true'
      shell: bash
      run: |
        git push
        git push --tags
